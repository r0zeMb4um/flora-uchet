<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оплата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1F4A52}a:hover{color:#163840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F2EE; font-family: 'Jost', Arial, sans-serif; color: #18272B; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3DED6">
    <button type="button" aria-label="Назад" style="border: none; background: none; padding: 0; min-width: 44px; min-height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div style="font-size: 16px; font-weight: 600">Оплата</div>
    <div style="width: 44px"></div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #FFFFFF; border: 1px solid #E3DED6; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 14px; color: #5B6B6E">Букет · 11 шт</div>
      <div style="font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums">15 000 ₸</div>
      <div style="font-size: 14px; color: #5B6B6E">Скидки нет</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; font-weight: 600">Способ оплаты</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 52px; border: 1px solid #E3DED6; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #18272B">Наличные</button>
        <button type="button" style="height: 52px; border: 1px solid #E3DED6; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #18272B">Безнал</button>
        <button type="button" aria-pressed="true" style="height: 52px; border: 2px solid #1F4A52; border-radius: 12px; background: #E4EEEE; font-family: inherit; font-size: 16px; font-weight: 600; color: #1F4A52">Нал + безнал</button>
        <button type="button" style="height: 52px; border: 1px solid #E3DED6; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #18272B">В долг</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3DED6; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 16px">Наличными
        <input type="text" inputmode="numeric" value="5 000 ₸" style="width: 150px; height: 48px; border: 2px solid #1F4A52; border-radius: 10px; padding: 0 12px; text-align: right; font-family: inherit; font-size: 18px; font-weight: 600; color: #18272B; font-variant-numeric: tabular-nums">
      </label>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 16px">
        <span>Безналом (Kaspi, терминал)</span>
        <span style="width: 150px; text-align: right; font-size: 18px; font-weight: 600; color: #5B6B6E; font-variant-numeric: tabular-nums">10 000 ₸</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #2E6B4F; border-top: 1px solid #E3DED6; padding-top: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E6B4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
        Сумма сходится: 5 000 + 10 000 = 15 000 ₸
      </div>
    </div>

    <div style="font-size: 13px; color: #5B6B6E; line-height: 1.4">Безнал считается сам как остаток от цены. Не забудьте пробить чек на онлайн-кассе — бот её не заменяет.</div>
  </div>

  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E3DED6">
    <button type="button" style="width: 100%; height: 52px; border: none; border-radius: 12px; background: #1F4A52; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Провести 15 000 ₸</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
