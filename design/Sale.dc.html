<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сборка букета</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#1F4A52}a:hover{color:#163840}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F2EE; font-family: 'Jost', Arial, sans-serif; color: #18272B; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3DED6">
    <button type="button" aria-label="Назад" style="border: none; background: none; padding: 0; min-width: 44px; min-height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div style="font-size: 16px; font-weight: 600">Букет</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E3DED6; border-radius: 12px; padding: 0 12px; height: 44px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B6E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Поиск позиции</span>
      <input type="search" placeholder="Поиск: роза, эвкалипт…" style="border: none; outline: none; flex: 1; font-family: inherit; font-size: 15px; background: transparent; color: #18272B">
    </label>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" style="border: none; border-radius: 999px; background: #1F4A52; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 14px; height: 36px">Цветы</button>
      <button type="button" style="border: 1px solid #E3DED6; border-radius: 999px; background: #FFFFFF; color: #18272B; font-family: inherit; font-size: 14px; padding: 0 14px; height: 36px">Зелень</button>
      <button type="button" style="border: 1px solid #E3DED6; border-radius: 999px; background: #FFFFFF; color: #18272B; font-family: inherit; font-size: 14px; padding: 0 14px; height: 36px">Упаковка</button>
      <button type="button" style="border: 1px solid #E3DED6; border-radius: 999px; background: #FFFFFF; color: #18272B; font-family: inherit; font-size: 14px; padding: 0 14px; height: 36px">Игрушки</button>
    </div>
  </div>

  <div style="flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid {{item.border}}; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 500">{{item.name}}</div>
          <div style="font-size: 13px; color: {{item.stockColor}}">{{item.meta}}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px">
          <button type="button" aria-label="Убрать одну" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #E3DED6; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #1F4A52">−</button>
          <div style="width: 28px; text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">{{item.qty}}</div>
          <button type="button" aria-label="Добавить одну" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: #E4EEEE; font-family: inherit; font-size: 20px; color: #1F4A52">+</button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E3DED6; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5B6B6E">
      <span>Состав: 11 шт</span>
      <span style="font-variant-numeric: tabular-nums">по каталогу 10 200 ₸</span>
    </div>
    <div style="display: flex; gap: 10px">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5B6B6E">Цена букета
        <input type="text" inputmode="numeric" value="15 000 ₸" style="height: 44px; border: 2px solid #1F4A52; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 18px; font-weight: 600; color: #18272B; font-variant-numeric: tabular-nums">
      </label>
      <label style="width: 120px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5B6B6E">Скидка
        <button type="button" style="height: 44px; border: 1px solid #E3DED6; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #18272B">Нет</button>
      </label>
    </div>
    <button type="button" style="width: 100%; height: 52px; border: none; border-radius: 12px; background: #1F4A52; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Далее — оплата 15 000 ₸</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = '#1F4A52', idle = '#E3DED6', ok = '#5B6B6E', low = '#9A5A34';
    return {
      items: [
        { name: 'Роза красная 60 см', meta: '1 200 ₸ · в наличии 83', qty: 7, border: sel, stockColor: ok },
        { name: 'Роза белая 60 см', meta: '1 200 ₸ · осталось 8, ниже минимума', qty: 0, border: idle, stockColor: low },
        { name: 'Эвкалипт', meta: '500 ₸ · осталось 12, ниже минимума', qty: 3, border: sel, stockColor: low },
        { name: 'Хризантема кустовая', meta: '900 ₸ · в наличии 40', qty: 0, border: idle, stockColor: ok },
        { name: 'Крафт-бумага', meta: '300 ₸ · в наличии 60', qty: 1, border: sel, stockColor: ok }
      ]
    };
  }
}
</script>
</body>
</html>
